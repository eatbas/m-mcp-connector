# Generated by scripts/sync-connector.mjs in the private repository. Do not edit here.
#
# Publishes @atbas/m-mcp-connector to npm.
#
# Manual only. There is no push or tag trigger, deliberately: a published version
# cannot be withdrawn after seventy-two hours, and a workflow that fires on a tag
# will one day fire on a tag somebody pushed for another reason. This runs when a
# person decides it should — normally through scripts/release.sh in the private
# repository, which dispatches it dry first and cuts the git tag only after the
# registry confirms the version.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must match package.json exactly — a deliberate double entry, so publishing the wrong thing takes two mistakes rather than one.'
        required: true
        type: string
      dry_run:
        description: 'Run every gate and pack the tarball, then stop before publishing. Use this first.'
        required: false
        default: true
        type: boolean

# `id-token: write` is what makes `--provenance` possible. It is available here
# and not in the private repository for one reason: npm will not attest a build
# whose source repository is private, which is the whole reason this mirror
# exists.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Writes the .npmrc that NODE_AUTH_TOKEN below is read through.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The double entry. Publishing the wrong version is not correctable.
      - name: Confirm the requested version is the manifest's version
        run: |
          manifest="$(node -p 'require("./package.json").version')"
          requested='${{ inputs.version }}'
          if [ "$manifest" != "$requested" ]; then
            echo "Refusing to publish: package.json is $manifest, the run requested $requested." >&2
            exit 1
          fi
          echo "package.json is $manifest, which matches the requested version."

      # A second publish of an existing version fails inside npm with a message
      # about the registry rather than about this repository. Saying so here
      # turns a confusing 403 into a sentence naming the cause.
      - name: Confirm this version is not already on the registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Refusing to publish: $name@$version already exists and cannot be replaced." >&2
            exit 1
          fi
          echo "$name@$version is not on the registry yet."

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # What actually ships, listed before it ships. `files` is easy to widen by
      # accident and the tarball is the only place the mistake is visible.
      #
      # `--input-type=commonjs` is not optional: this package.json says
      # `"type": "module"`, so a bare `node -e` is evaluated as ESM and
      # `require` is not defined in it.
      - name: Pack and show the tarball's contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node --input-type=commonjs -e '
            const { readFileSync } = require("node:fs");
            // npm 11 and earlier report an array; npm 12 reports an object keyed
            // by package name. The npm on the runner comes from .nvmrc, so both
            // shapes have to be read rather than assumed.
            //
            // No apostrophe may appear anywhere in this script: it is one
            // single-quoted shell argument, and an apostrophe ends it.
            const packed = JSON.parse(readFileSync("/tmp/pack.json", "utf8"));
            const entry = Array.isArray(packed) ? packed[0] : Object.values(packed)[0];
            const files = entry.files.map((file) => file.path).sort();
            console.log(files.join("\n"));
            const allowed = /^(dist\/|README\.md$|LICENSE$|package\.json$)/;
            const unexpected = files.filter((path) => !allowed.test(path));
            if (unexpected.length > 0) {
              console.error("Refusing to publish: unexpected files in the tarball:\n" + unexpected.join("\n"));
              process.exit(1);
            }
            console.log("Tarball holds " + files.length + " file(s), all expected.");
          '

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run complete
        if: ${{ inputs.dry_run != false }}
        run: echo "Every gate passed and the tarball packs. Nothing was published."
