# Generated by scripts/sync-connector.mjs in the private repository. Do not edit here.
#
# Every action is pinned by commit SHA rather than by tag: a tag is mutable, and
# a tag pin lets whoever can move it replace the code that runs in this
# repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor this package declares, and the current LTS. The floor is
        # tested rather than merely declared: npm only warns about
        # `engines.node` unless the installer set `engine-strict`, so nothing
        # else would notice it being broken.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
